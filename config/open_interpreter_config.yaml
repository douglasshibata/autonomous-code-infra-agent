# Open Interpreter Profile Configuration
llm:
  backend: "ollama"
  model: "qwen2.5-coder:7b"
  api_base: "http://ollama:11434/v1"
  temperature: 0.1
  max_tokens: 4096
  offline: true

orchestration:
  auto_run: true
  headless: true
  system_prompt_file: "config/system_prompt.txt"
  safe_mode: "sandbox"
  max_output_lines: 500
  timeout_seconds: 300

sandbox:
  enabled: true
  container_name: "sandbox-code-executor"
  workspace_dir: "/sandbox_workspace"
  isolated_network: false

self_healing:
  enabled: true
  max_retries: 3
  auto_install_missing_packages: true
  exponential_backoff_base: 2
